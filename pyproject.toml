[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herta-assistant"
version = "1.0.0"
description = "Madam Herta AI Assistant with authentic Yamazaki Haruka RVC voice, boot greetings, and sleep monitor."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rinne"}
]
dependencies = [
    "edge-tts>=7.0.0",
    "soundfile>=0.12.0",
    "requests>=2.28.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "librosa>=0.9.1",
    "PyQt6>=6.6.0",
    "Pillow>=9.0.0"
]

[project.scripts]
herta = "herta.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["herta*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

